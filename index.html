<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whusnet - Technician Portal</title>
    
    <!-- Tautan ke CSS Terpisah -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Font & Icon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        dark: { bg: '#000000', panel: '#0a0a0a', border: '#222222', text: '#ffffff', muted: '#888888' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Memastikan background hitam murni */
        body { background-color: #000000; color: #ffffff; }
        
        /* Kustomisasi input date/select icon untuk dark mode */
        ::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>
<body class="antialiased relative min-h-screen">

    <!-- Navbar: Diturunkan dengan pt-12 (padding-top) agar tidak mentok status bar -->
    <nav class="sticky top-0 z-50 px-4 pt-12 pb-4 bg-black/80 backdrop-blur-md">
        <div class="max-w-md mx-auto bg-dark-panel text-white rounded-2xl px-5 py-3.5 flex justify-between items-center border border-dark-border">
            <!-- Whusnet Logo Monochrome -->
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl border border-dark-border bg-black flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                </div>
                <div class="flex flex-col leading-none">
                    <span class="text-xl font-bold tracking-tight text-white">WHUSNET</span>
                    <span class="text-[10px] font-medium text-dark-muted tracking-widest uppercase mt-0.5">Technician</span>
                </div>
            </div>
            
            <div class="w-9 h-9 bg-black rounded-full flex items-center justify-center text-sm font-bold border border-dark-border">
                <i class="fa-regular fa-user text-dark-muted"></i>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 py-2 pb-24">
        
        <!-- Welcome Banner -->
        <div class="mb-6 px-1 flex items-end justify-between">
            <div>
                <p class="text-xs font-medium text-dark-muted mb-1" id="currentDate">--</p>
                <h1 class="text-2xl font-bold text-white tracking-tight">Siap bertugas? 🚀</h1>
            </div>
        </div>

        <!-- Quick Actions Menu -->
        <div class="mb-8 grid grid-cols-2 gap-4">
            <a href="speedtest.html" class="bg-dark-panel text-white p-4 rounded-2xl flex items-center border border-dark-border hover:bg-[#111] transition cursor-pointer">
                <div class="w-10 h-10 bg-black rounded-full flex items-center justify-center mr-3 border border-dark-border">
                    <i class="fa-solid fa-gauge-high text-white text-lg"></i>
                </div>
                <div>
                    <p class="text-sm font-bold">Speed Test</p>
                    <p class="text-[10px] text-dark-muted font-medium">Uji Kualitas</p>
                </div>
            </a>
            
            <div class="bg-dark-panel p-4 rounded-2xl flex items-center border border-dark-border opacity-50">
                <div class="w-10 h-10 bg-black rounded-full flex items-center justify-center mr-3 border border-dark-border">
                    <i class="fa-solid fa-toolbox text-dark-muted"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-dark-muted">Alat Lain</p>
                    <p class="text-[10px] text-dark-muted font-medium">Segera Hadir</p>
                </div>
            </div>
        </div>

        <!-- Form Card Monochrome -->
        <div class="bg-dark-panel rounded-3xl border border-dark-border overflow-hidden">
            <div class="border-b border-dark-border px-6 py-4">
                <h2 class="font-bold text-white flex items-center text-lg">
                    <i class="fa-solid fa-clipboard-check mr-2.5 text-dark-muted"></i> Laporan Harian
                </h2>
            </div>
            
            <form id="reportForm" class="p-6 space-y-5">
                <input type="hidden" name="tanggal" id="tanggal">
                <input type="hidden" name="hari" id="hari">
                
                <div>
                    <label class="block text-xs font-bold text-dark-muted uppercase tracking-wider mb-2 ml-1">Nama Teknisi</label>
                    <input type="text" name="teknisi" required placeholder="Cth: Budi Pratama" class="w-full px-4 py-3 bg-black border border-dark-border rounded-xl focus:outline-none focus:border-white text-white placeholder-[#444] transition-all text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-dark-muted uppercase tracking-wider mb-2 ml-1">No. Tiket / Order</label>
                    <input type="text" name="tiket" id="tiket" required placeholder="TKT-20230912" class="w-full px-4 py-3 bg-black border border-dark-border rounded-xl focus:outline-none focus:border-white text-white placeholder-[#444] transition-all text-sm uppercase">
                </div>

                <div>
                    <label class="block text-xs font-bold text-dark-muted uppercase tracking-wider mb-2 ml-1">Pelanggan & Lokasi</label>
                    <input type="text" name="pelanggan" id="pelanggan" required placeholder="Cth: Warnet Jaya - Jl. Sudirman" class="w-full px-4 py-3 bg-black border border-dark-border rounded-xl focus:outline-none focus:border-white text-white placeholder-[#444] transition-all text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-dark-muted uppercase tracking-wider mb-2 ml-1">Jenis Pekerjaan</label>
                    <div class="relative">
                        <select name="deskripsi" id="pekerjaan" required class="w-full px-4 py-3 bg-black border border-dark-border rounded-xl focus:outline-none focus:border-white text-white transition-all text-sm appearance-none">
                            <option value="" disabled selected class="text-[#444]">Pilih jenis pekerjaan...</option>
                            <option value="Instalasi Baru (PSB)">Instalasi Baru (PSB)</option>
                            <option value="Maintenance / Gangguan">Maintenance / Gangguan</option>
                            <option value="Splicing / Perbaikan Kabel">Splicing / Perbaikan Kabel</option>
                            <option value="Dismantle / Pencabutan">Dismantle / Pencabutan</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-4 text-dark-muted text-sm pointer-events-none"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-dark-muted uppercase tracking-wider mb-2 ml-1">Material Digunakan</label>
                    <textarea name="material" id="material" rows="2" placeholder="Cth: Drop core 50m, 2 Fast Connector, 1 Roset..." class="w-full px-4 py-3 bg-black border border-dark-border rounded-xl focus:outline-none focus:border-white text-white placeholder-[#444] transition-all text-sm resize-none"></textarea>
                </div>

                <!-- Status (Segmented Control Dark) -->
                <div>
                    <label class="block text-xs font-bold text-dark-muted uppercase tracking-wider mb-2 ml-1">Status Pekerjaan</label>
                    <div class="flex p-1 bg-black rounded-xl border border-dark-border">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="status" value="Selesai" class="peer sr-only" checked>
                            <div class="text-center py-2.5 rounded-lg peer-checked:bg-[#222] peer-checked:text-white text-dark-muted text-sm font-bold transition-all">
                                Selesai
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="status" value="Pending" class="peer sr-only">
                            <div class="text-center py-2.5 rounded-lg peer-checked:bg-[#222] peer-checked:text-white text-dark-muted text-sm font-bold transition-all">
                                Pending
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="status" value="Kendala" class="peer sr-only">
                            <div class="text-center py-2.5 rounded-lg peer-checked:bg-[#222] peer-checked:text-white text-dark-muted text-sm font-bold transition-all">
                                Kendala
                            </div>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-dark-muted uppercase tracking-wider mb-2 ml-1">Hasil Redaman & Keterangan</label>
                    <input type="text" name="keterangan" id="keterangan" placeholder="Cth: Rx -19.5 dBm. Aman." class="w-full px-4 py-3 bg-black border border-dark-border rounded-xl focus:outline-none focus:border-white text-white placeholder-[#444] transition-all text-sm">
                </div>

                <button type="submit" class="w-full bg-transparent border-2 border-white text-white hover:bg-white hover:text-black font-bold py-3.5 px-4 rounded-xl transition-all active:scale-[0.98] flex items-center justify-center mt-6">
                    KIRIM LAPORAN
                </button>
            </form>
        </div>

        <!-- Recent Submissions -->
        <div class="mt-8">
            <h3 class="text-sm font-bold text-dark-muted mb-4 px-1 flex items-center justify-between">
                <span>Riwayat Hari Ini</span>
            </h3>
            <div id="recentLogs" class="space-y-3">
                <div class="text-center py-8 text-sm font-medium text-dark-muted border border-dark-border rounded-2xl bg-dark-panel" id="emptyState">
                    Belum ada laporan ditarik.
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification Dark -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-[#222] text-white px-4 py-3 rounded-2xl flex items-center space-x-3 transition-all duration-300 toast-enter hidden z-50 w-[90%] max-w-sm border border-[#444]">
        <div class="w-8 h-8 border border-white rounded-full flex items-center justify-center flex-shrink-0">
            <i class="fa-solid fa-check text-white text-xs"></i>
        </div>
        <div class="flex-1">
            <p class="text-sm font-bold">Laporan Terkirim!</p>
        </div>
    </div>

    <!-- Tautan ke JavaScript -->
    <script src="script.js"></script>
</body>
</html>

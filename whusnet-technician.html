<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhusNet Technician — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0A101E;
  --page:#050810;
  --surface:#121A2E;
  --surface-2:#1A2440;
  --surface-3:#233052;
  --text:#EAF0FB;
  --text-dim:#8A97B8;
  --text-faint:#556082;
  --border:rgba(255,255,255,.08);
  --border-soft:rgba(255,255,255,.05);
  --accent:#22D3C7;
  --accent-dim:rgba(34,211,199,.14);
  --accent-2:#5B8CFF;
  --good:#3ED598;
  --good-dim:rgba(62,213,152,.14);
  --warn:#F5B62E;
  --warn-dim:rgba(245,182,46,.14);
  --bad:#F0475F;
  --bad-dim:rgba(240,71,95,.14);
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow:0 20px 60px rgba(0,0,0,.5);
  --font-ui:'Plus Jakarta Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html.light{
  --bg:#F2F4FA;
  --page:#E4E8F2;
  --surface:#FFFFFF;
  --surface-2:#F3F5FB;
  --surface-3:#E9ECF6;
  --text:#101528;
  --text-dim:#5B6685;
  --text-faint:#8891AC;
  --border:rgba(16,20,40,.09);
  --border-soft:rgba(16,20,40,.05);
  --accent:#0EA5A0;
  --accent-dim:rgba(14,165,160,.10);
  --shadow:0 20px 50px rgba(30,40,70,.16);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:radial-gradient(ellipse at top, #0d1526 0%, var(--page) 60%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 12px;
  font-family:var(--font-ui);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
html.light body{ background:radial-gradient(ellipse at top, #ffffff 0%, var(--page) 65%); }
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

/* ============ DEVICE FRAME ============ */
.wrap{display:flex; flex-direction:column; align-items:center; gap:14px;}
.brandline{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--text-faint);
}
.device{
  width:390px; height:832px;
  background:var(--bg);
  border-radius:44px;
  border:10px solid #05070d;
  box-shadow:var(--shadow), 0 0 0 1px rgba(255,255,255,.04);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
html.light .device{ border-color:#151a2c; }
.notch{
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:120px; height:26px; background:#05070d; border-radius:0 0 16px 16px; z-index:50;
}
.statusbar{
  height:46px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 26px 0 24px; font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--text);
}
.statusbar .icons{display:flex; align-items:center; gap:5px;}
.sig-bars{display:flex; align-items:flex-end; gap:2px; height:10px;}
.sig-bars i{width:3px; background:currentColor; border-radius:1px; display:block;}
.sig-bars i:nth-child(1){height:4px;} .sig-bars i:nth-child(2){height:6px;}
.sig-bars i:nth-child(3){height:8px;} .sig-bars i:nth-child(4){height:10px;}
.batt{width:22px; height:11px; border:1.4px solid currentColor; border-radius:3px; position:relative; padding:1.5px;}
.batt::after{content:'';position:absolute; right:-3.5px; top:3px; width:2px; height:5px; background:currentColor; border-radius:0 1px 1px 0;}
.batt i{display:block; height:100%; width:78%; background:currentColor; border-radius:1px;}

/* ============ APP HEADER ============ */
.appbar{
  flex-shrink:0; padding:6px 18px 14px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--border-soft);
}
.appbar .back-btn{
  width:34px; height:34px; border-radius:10px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.appbar .back-btn svg{width:18px; height:18px;}
.appbar .title-block{flex:1; min-width:0;}
.appbar .title-block h1{font-size:17px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.appbar .title-block p{font-size:11.5px; color:var(--text-dim); margin-top:1px;}
.appbar .brandmark{display:flex; align-items:center; gap:8px;}
.pulse-mark{position:relative; width:30px; height:30px; border-radius:9px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;}
.pulse-mark .line{position:absolute; left:5px; right:5px; top:50%; height:1.5px; background:var(--border);}
.pulse-mark .dot{position:absolute; top:50%; left:5px; width:5px; height:5px; margin-top:-2.5px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px 1px var(--accent); animation:pulseTravel 2.4s ease-in-out infinite;}
@keyframes pulseTravel{0%{left:5px;opacity:.2;} 50%{left:20px;opacity:1;} 100%{left:5px;opacity:.2;}}
.appbar .icon-btn{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.appbar .icon-btn svg{width:17px;height:17px;color:var(--text-dim);}

/* ============ SCREENS ============ */
.screens{flex:1; position:relative; overflow:hidden;}
.screen{
  position:absolute; inset:0; overflow-y:auto; padding:16px 18px 100px;
  display:none; animation:fadeIn .25s ease;
}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ============ COMMON COMPONENTS ============ */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px;}
.section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}
.pill{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:99px;}
.pill.good{background:var(--good-dim); color:var(--good);}
.pill.warn{background:var(--warn-dim); color:var(--warn);}
.pill.bad{background:var(--bad-dim); color:var(--bad);}
.pill.neutral{background:var(--surface-3); color:var(--text-dim);}
.dot{width:7px;height:7px;border-radius:50%; flex-shrink:0;}
.dot.good{background:var(--good); box-shadow:0 0 0 3px var(--good-dim);}
.dot.warn{background:var(--warn); box-shadow:0 0 0 3px var(--warn-dim);}
.dot.bad{background:var(--bad); box-shadow:0 0 0 3px var(--bad-dim);}
.dot.pulse{animation:dotpulse 1.8s ease-in-out infinite;}
@keyframes dotpulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
.btn{display:flex; align-items:center; justify-content:center; gap:7px; height:46px; border-radius:13px; font-weight:700; font-size:14px;}
.btn.primary{background:var(--accent); color:#04211E;}
html.light .btn.primary{color:#fff;}
.btn.primary:active{filter:brightness(.92);}
.btn.ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
.btn.danger{background:var(--bad-dim); color:var(--bad);}
.btn[disabled]{opacity:.4; pointer-events:none;}
.mono{font-family:var(--font-mono);}
.input{
  width:100%; height:44px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
  padding:0 13px; font-size:14px; color:var(--text);
}
.input:focus, select.input:focus{outline:none; border-color:var(--accent);}
textarea.input{height:80px; padding:11px 13px; resize:none; line-height:1.5;}
select.input{appearance:none; -webkit-appearance:none;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
.field{margin-bottom:14px;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
.list-item{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border-soft);}
.list-item:last-child{border-bottom:none;}
.icon-chip{width:38px; height:38px; border-radius:11px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--accent);}
.icon-chip svg{width:18px; height:18px;}
.empty-note{font-size:12.5px; color:var(--text-faint); text-align:center; padding:18px 10px; line-height:1.6;}

/* ============ BOTTOM NAV ============ */
.bottomnav{
  position:absolute; left:0; right:0; bottom:0; height:82px; padding-bottom:14px;
  background:var(--surface); border-top:1px solid var(--border);
  display:flex; align-items:flex-start; padding-top:9px; z-index:40;
}
.navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-faint);}
.navbtn svg{width:21px; height:21px;}
.navbtn span{font-size:10.5px; font-weight:600;}
.navbtn.active{color:var(--accent);}

/* ============ DASHBOARD ============ */
.greet-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.greet-row h1{font-size:20px; font-weight:800; letter-spacing:-.01em;}
.greet-row p{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
.weather-chip{display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:99px; padding:7px 12px 7px 9px;}
.weather-chip svg{width:16px;height:16px; color:var(--warn);}
.weather-chip span{font-size:12px; font-weight:700; font-family:var(--font-mono);}
.net-status{display:flex; align-items:center; gap:9px; background:var(--good-dim); border:1px solid rgba(62,213,152,.25); border-radius:13px; padding:11px 14px; margin-bottom:16px;}
.net-status .txt{flex:1;}
.net-status .txt b{font-size:12.5px; color:var(--good); display:block;}
.net-status .txt span{font-size:11px; color:var(--text-dim);}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px;}
.stat-card .num{font-family:var(--font-mono); font-size:26px; font-weight:700; color:var(--accent);}
.stat-card .lbl{font-size:11.5px; color:var(--text-dim); margin-top:3px; font-weight:600;}
.next-card{background:linear-gradient(155deg, var(--surface-2), var(--surface)); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; margin-bottom:20px;}
.next-card .top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
.next-card .name{font-size:15.5px; font-weight:700;}
.next-card .addr{font-size:12px; color:var(--text-dim); margin-top:3px;}
.next-card .meta{display:flex; gap:14px; margin:12px 0 14px; font-size:11.5px; color:var(--text-dim);}
.next-card .meta b{color:var(--text); font-family:var(--font-mono); display:block; font-size:13px;}
.quick-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:2px; margin-bottom:6px;}
.quick-item{flex-shrink:0; width:78px; display:flex; flex-direction:column; align-items:center; gap:7px;}
.quick-item .ic{width:52px; height:52px; border-radius:15px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--accent);}
.quick-item .ic svg{width:22px;height:22px;}
.quick-item span{font-size:10.5px; font-weight:600; text-align:center; color:var(--text-dim); line-height:1.25;}
.mini-cust{display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--border-soft);}
.mini-cust:last-child{border:none;}
.mini-cust .av{width:36px;height:36px;border-radius:10px;background:var(--surface-3); display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700; color:var(--text-dim); flex-shrink:0;}
.mini-cust .info{flex:1; min-width:0;}
.mini-cust .info b{font-size:13px; display:block;}
.mini-cust .info span{font-size:11px; color:var(--text-faint);}
.mini-cust .dist{font-size:11px; font-family:var(--font-mono); color:var(--accent); font-weight:600;}

/* ============ JADWAL ============ */
.seg{display:flex; background:var(--surface-2); border-radius:12px; padding:3px; margin-bottom:16px;}
.seg button{flex:1; height:36px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--text-dim);}
.seg button.active{background:var(--surface); color:var(--text); box-shadow:0 2px 6px rgba(0,0,0,.15);}
.job-card{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--border-soft);}
.job-card:last-child{border:none;}
.job-time{width:52px; flex-shrink:0; text-align:center;}
.job-time b{font-family:var(--font-mono); font-size:14px; display:block;}
.job-time span{font-size:9.5px; color:var(--text-faint);}
.job-line{width:2px; background:var(--border); border-radius:1px; position:relative; flex-shrink:0;}
.job-line i{position:absolute; top:2px; left:50%; transform:translateX(-50%); width:8px; height:8px; border-radius:50%; background:var(--accent);}
.job-body{flex:1; min-width:0;}
.job-body .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.job-body b{font-size:13.5px;}
.job-body .addr{font-size:11.5px; color:var(--text-dim); margin:3px 0 7px;}
.job-tags{display:flex; gap:6px; flex-wrap:wrap;}

/* ============ PELANGGAN ============ */
.search-wrap{position:relative; margin-bottom:16px;}
.search-wrap svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--text-faint);}
.search-wrap input{padding-left:38px;}
.cust-row{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border-soft);}
.cust-row:last-child{border:none;}
.cust-row .av{width:42px;height:42px;border-radius:12px;background:var(--surface-2); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; font-size:13px; font-weight:700; color:var(--accent); flex-shrink:0;}
.cust-row .info{flex:1; min-width:0;}
.cust-row .info b{font-size:13.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cust-row .info span{font-size:11.5px; color:var(--text-faint);}
.cust-row svg.chev{width:16px;height:16px; color:var(--text-faint); flex-shrink:0;}
.detail-hero{display:flex; align-items:center; gap:13px; margin-bottom:18px;}
.detail-hero .av{width:56px;height:56px;border-radius:16px;background:var(--surface-2); border:1px solid var(--border); display:flex;align-items:center;justify-content:center; font-size:18px; font-weight:700; color:var(--accent);}
.detail-hero h2{font-size:17px; font-weight:800;}
.detail-hero p{font-size:12px; color:var(--text-dim); margin-top:2px;}
.info-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--border-soft); font-size:13px;}
.info-row:last-child{border:none;}
.info-row .k{color:var(--text-dim); font-size:12px;}
.info-row .v{font-weight:600; text-align:right; max-width:60%;}
.link-row{color:var(--accent); font-weight:700;}
.hist-row{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-soft); font-size:12px;}
.hist-row:last-child{border:none;}
.hist-row .b{width:6px;height:6px;border-radius:50%; background:var(--accent); margin-top:5px; flex-shrink:0;}
.hist-row span{color:var(--text-dim);}

/* ============ CALCULATORS ============ */
.result-box{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-top:16px; text-align:center;}
.result-box .big{font-family:var(--font-mono); font-size:32px; font-weight:700; margin:6px 0 2px;}
.result-box .lbl{font-size:11.5px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
.power-scale{position:relative; height:8px; border-radius:99px; background:linear-gradient(90deg, var(--bad) 0%, var(--warn) 18%, var(--good) 32%, var(--good) 78%, var(--warn) 90%, var(--bad) 100%); margin:18px 0 8px;}
.power-scale .marker{position:absolute; top:-5px; width:3px; height:18px; background:var(--text); border-radius:2px; box-shadow:0 0 0 2px var(--bg);}
.scale-labels{display:flex; justify-content:space-between; font-size:10px; font-family:var(--font-mono); color:var(--text-faint);}
.res-mini-row{display:flex; gap:10px; margin-top:14px;}
.res-mini{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:10px; text-align:center;}
.res-mini .n{font-family:var(--font-mono); font-weight:700; font-size:15px;}
.res-mini .l{font-size:10px; color:var(--text-faint); margin-top:2px;}
.donut-wrap{display:flex; justify-content:center; margin:6px 0 18px;}
.donut{width:160px; height:160px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative;}
.donut .hole{width:118px; height:118px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center;}
.donut .hole b{font-family:var(--font-mono); font-size:24px; font-weight:700;}
.donut .hole span{font-size:10px; color:var(--text-faint); font-weight:600;}

/* ============ SPEEDTEST ============ */
.st-ring-wrap{display:flex; justify-content:center; margin:10px 0 8px;}
.st-ring{width:190px; height:190px; border-radius:50%; position:relative; display:flex; align-items:center; justify-content:center;}
.st-ring .hole{width:150px; height:150px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center;}
.st-ring .hole .v{font-family:var(--font-mono); font-size:34px; font-weight:700; color:var(--accent);}
.st-ring .hole .u{font-size:11px; color:var(--text-dim); font-weight:600; margin-top:2px;}
.st-ring .hole .s{font-size:10px; color:var(--text-faint); margin-top:6px;}
.st-mini-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:16px 0;}
.st-mini{background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 8px; text-align:center;}
.st-mini .n{font-family:var(--font-mono); font-weight:700; font-size:15px;}
.st-mini .l{font-size:9.5px; color:var(--text-faint); margin-top:3px; text-transform:uppercase; letter-spacing:.03em;}
.st-meta{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-dim); padding:12px 0; border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); margin-bottom:16px;}
.hist-item{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px;}
.hist-item:last-child{border:none;}
.hist-item .d{color:var(--text-faint); font-size:11px;}

/* ============ CHECKLIST ============ */
.progress-track{height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-bottom:18px;}
.progress-fill{height:100%; background:var(--accent); border-radius:99px; transition:width .3s ease; width:0%;}
.chk-item{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border-soft);}
.chk-item:last-child{border:none;}
.chk-box{width:24px;height:24px;border-radius:8px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:.15s;}
.chk-box svg{width:14px;height:14px; opacity:0;}
.chk-item.checked .chk-box{background:var(--accent); border-color:var(--accent);}
.chk-item.checked .chk-box svg{opacity:1; color:#04211E;}
.chk-item span{font-size:13.5px; font-weight:600;}
.chk-item.checked span{color:var(--text-dim); text-decoration:line-through;}

/* ============ INVENTORY ============ */
.inv-row{padding:12px 0; border-bottom:1px solid var(--border-soft);}
.inv-row:last-child{border:none;}
.inv-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:7px;}
.inv-top b{font-size:13.5px;}
.inv-top .qty{font-family:var(--font-mono); font-size:12.5px; font-weight:700;}
.inv-bar{height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
.inv-bar i{display:block; height:100%; border-radius:99px; background:var(--accent);}
.inv-bar.low i{background:var(--bad);}

/* ============ PROFIL ============ */
.profile-hero{display:flex; flex-direction:column; align-items:center; text-align:center; padding:8px 0 20px;}
.profile-hero .av{width:84px;height:84px;border-radius:24px; background:linear-gradient(155deg, var(--surface-2), var(--surface-3)); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:var(--accent); margin-bottom:12px;}
.profile-hero h2{font-size:18px; font-weight:800;}

.switch.on{background:var(--accent);}
.switch.on::after{left:21px;}

.chat-scroll{display:flex; flex-direction:column; gap:10px; padding-bottom:8px;}
.bubble{max-width:76%; padding:10px 13px; border-radius:16px; font-size:13px; line-height:1.45;}

.bubble.me{align-self:flex-end; background:var(--accent); color:#04211E; border-bottom-right-radius:4px;}
.bubble-meta{font-size:9.5px; color:var(--text-faint); margin-top:3px;}

    <div class="st-mini"><div class="n" id="stJitter">—</div><div class="l">Jitter ms</div></div>
  </div>

function renderStHistory(){
  document.getElementById('stHistory').innerHTML = SPEED_HISTORY.map(h=>`
    <div class="hist-item"><div><b>${h.down}</b> / ${h.up} Mbps<div class="d">${h.d}</div></div><span class="pill neutral mono">${h.ping} ms</span></div>
  `).join('');
}
let stRunning = false;
function runSpeedtest(){
  if(stRunning) return;
  stRunning = true;
  const btn = document.getElementById('stBtn');
  btn.textContent = 'Menguji...'; btn.disabled = true;
  const ring = document.getElementById('stRing');
  const main = document.getElementById('stMain');
  const status = document.getElementById('stStatus');
  const upEl = document.getElementById('stUp'), pingEl = document.getElementById('stPing'), jitEl = document.getElementById('stJitter');
  status.textContent = 'Mengukur ping...';
  let progress = 0;
  const finalDown = (60 + Math.random()*220).toFixed(1);
  const finalUp = (15 + Math.random()*80).toFixed(1);
  const finalPing = Math.round(3+Math.random()*12);
  const finalJitter = (Math.random()*2.5).toFixed(1);
  pingEl.textContent = finalPing; jitEl.textContent = finalJitter;
  const iv = setInterval(()=>{
    progress += 5;
    const deg = Math.min(360, progress/100*360);
    const curVal = (finalDown * Math.min(1,progress/100)).toFixed(1);
    ring.style.background = `conic-gradient(var(--accent) ${deg}deg, var(--surface-2) ${deg}deg)`;
    main.textContent = curVal;
    status.textContent = progress<50 ? 'Mengukur download...' : (progress<100?'Mengukur upload...':'Selesai');
    upEl.textContent = progress>=50 ? (finalUp*Math.min(1,(progress-50)/50)).toFixed(1) : '—';
    if(progress>=100){
      clearInterval(iv);
      main.textContent = finalDown;
      upEl.textContent = finalUp;
      status.textContent = 'Tes selesai';
      btn.textContent = 'Ulangi Test'; btn.disabled = false;
      SPEED_HISTORY.unshift({d:'Baru saja', down:finalDown, up:finalUp, ping:finalPing});
      renderStHistory();
      stRunning = false;
    }
  }, 100);
}

addScreen('optical', `
  <div class="card">
    <div class="field"><label>Tx Power (dBm)</label><input class="input" type="number" step="0.1" id="opTx" value="-7" oninput="calcOptical()"></div>
    <div class="row">
      <div class="field"><label>Jumlah Connector</label><input class="input" type="number" min="0" id="opConn" value="2" oninput="calcOptical()"></div>
      <div class="field"><label>Splitter</label>
        <select class="input" id="opSplit" onchange="calcOptical()">
          <option value="0">Tidak ada</option>
          <option value="3.5">1:2 (3.5 dB)</option>
          <option value="7" selected>1:4 (7.0 dB)</option>
          <option value="10.5">1:8 (10.5 dB)</option>
          <option value="14">1:16 (14.0 dB)</option>
          <option value="17.5">1:32 (17.5 dB)</option>
        </select>
      </div>
    </div>
  </div>
  <div class="result-box">
    <div class="lbl">Rx Power Estimasi</div>
    <div class="big" id="opRx" style="color:var(--accent);">—</div>
    <span class="pill good" id="opStatus">Normal</span>
    <div class="power-scale"><div class="marker" id="opMarker" style="left:50%;"></div></div>
    <div class="scale-labels"><span>-30</span><span>-27</span><span>-8</span><span>0 dBm</span></div>
    <div class="res-mini-row">
      <div class="res-mini"><div class="n" id="opConnLoss">—</div><div class="l">Loss Connector</div></div>
      <div class="res-mini"><div class="n" id="opSplitLoss">—</div><div class="l">Loss Splitter</div></div>
      <div class="res-mini"><div class="n" id="opTotalLoss">—</div><div class="l">Total Redaman</div></div>
    </div>
  </div>
  <div class="empty-note">Standar redaman ideal GPON: Rx antara -8 dBm hingga -27 dBm. Loss connector diasumsikan 0.5 dB per titik.</div>
`);
function calcOptical(){
  const tx = parseFloat(document.getElementById('opTx').value)||0;
  const conn = parseFloat(document.getElementById('opConn').value)||0;
  const split = parseFloat(document.getElementById('opSplit').value)||0;
  const connLoss = conn*0.5;
  const totalLoss = connLoss+split;
  const rx = tx-totalLoss;
  document.getElementById('opConnLoss').textContent = connLoss.toFixed(1)+' dB';
  document.getElementById('opSplitLoss').textContent = split.toFixed(1)+' dB';
  document.getElementById('opTotalLoss').textContent = totalLoss.toFixed(1)+' dB';
  document.getElementById('opRx').textContent = rx.toFixed(1)+' dBm';
  const statusEl = document.getElementById('opStatus');
  let normal = rx <= -8 && rx >= -27;
  let warning = !normal && rx <= -6 && rx >= -29;
  if(normal){ statusEl.className='pill good'; statusEl.textContent='Normal'; }
  else if(warning){ statusEl.className='pill warn'; statusEl.textContent='Mendekati batas'; }
  else { statusEl.className='pill bad'; statusEl.textContent='Tidak Normal'; }
  const pct = Math.min(100, Math.max(0, ((rx+30)/30)*100));
  document.getElementById('opMarker').style.left = pct+'%';
}

addScreen('odp', `
  <div class="card">
    <div class="row">
      <div class="field"><label>Jumlah Port</label>
        <select class="input" id="odpTotal" onchange="calcOdp()">
          <option value="8">8 Port</option>
          <option value="16" selected>16 Port</option>
          <option value="24">24 Port</option>
        </select>
      </div>
      <div class="field"><label>Port Terpakai</label><input class="input" type="number" min="0" id="odpUsed" value="11" oninput="calcOdp()"></div>
    </div>
  </div>
  <div class="donut-wrap"><div class="donut" id="odpDonut"><div class="hole"><b id="odpPct">—</b><span>TERPAKAI</span></div></div></div>
  <div class="res-mini-row">
    <div class="res-mini"><div class="n" id="odpTotalOut">—</div><div class="l">Total Port</div></div>
    <div class="res-mini"><div class="n" id="odpUsedOut">—</div><div class="l">Terpakai</div></div>
    <div class="res-mini"><div class="n" id="odpFreeOut">—</div><div class="l">Kosong</div></div>
  </div>
`);
function calcOdp(){
  const total = parseInt(document.getElementById('odpTotal').value);
  let used = parseInt(document.getElementById('odpUsed').value)||0;
  used = Math.min(used, total);
  document.getElementById('odpUsed').value = used;
  const free = total-used;
  const pct = Math.round((used/total)*100);
  const color = pct>90?'var(--bad)':pct>70?'var(--warn)':'var(--good)';
  document.getElementById('odpDonut').style.background = `conic-gradient(${color} ${pct*3.6}deg, var(--surface-2) 0deg)`;
  document.getElementById('odpPct').textContent = pct+'%';
  document.getElementById('odpPct').style.color = color;
  document.getElementById('odpTotalOut').textContent = total;
  document.getElementById('odpUsedOut').textContent = used;
  document.getElementById('odpFreeOut').textContent = free;
}

    <div class="set-row"><div class="icon-chip" style="width:32px;height:32px;border-radius:9px;">${ICO.sync}</div><div class="txt"><b>Sinkronisasi</b><span id="syncLabel">Terakhir sync: 2 menit lalu</span></div>
      <button class="btn ghost" style="height:38px; padding:0 12px;" onclick="doSync()">Sync</button>
    </div>
    <div class="set-row"><div class="icon-chip" style="width:32px;height:32px;border-radius:9px;">${ICO.box}</div><div class="txt"><b>Backup Data</b><span>Cadangkan data lokal ke server</span></div>
      <button class="btn ghost" style="height:38px; padding:0 12px;" onclick="toast('Backup data dimulai')">Backup</button>
    </div>
  </div>
  <button class="btn danger" style="width:100%; margin-top:20px;" onclick="toast('Sesi teknisi diakhiri')">Logout</button>
`);
function toggleDark(){
  document.documentElement.classList.toggle('light');
  document.getElementById('darkSwitch').classList.toggle('on');
}
function doSync(){
  document.getElementById('syncLabel').textContent = 'Menyinkronkan...';
  setTimeout(()=>{ document.getElementById('syncLabel').textContent = 'Terakhir sync: baru saja'; }, 900);
}

/* ---------- CHAT ---------- */
addScreen('chat', `
  <div class="chat-scroll" id="chatScroll">
    <div class="bubble them">Pak Dedi, tolong prioritaskan gangguan di Jl. Kenanga dulu ya, pelanggan sudah komplain 2x.<div class="bubble-meta">SPV Area — 08:12</div></div>
    <div class="bubble me">Siap Pak, saya ke sana setelah instalasi di Diponegoro selesai.<div class="bubble-meta">Anda — 08:14</div></div>
    <div class="bubble them">Oke, kirim foto redaman kalau sudah sampai.<div class="bubble-meta">SPV Area — 08:15</div></div>
  </div>
  <div style="height:64px;"></div>
  <div class="chat-inputbar">
    <input class="input" id="chatInput" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">${ICO.send}</button>
  </div>
`);
function sendChat(){
  const inp = document.getElementById('chatInput');
  const txt = inp.value.trim();
  if(!txt) return;
  const scroll = document.getElementById('chatScroll');
  const time = new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  scroll.insertAdjacentHTML('beforeend', `<div class="bubble me">${txt}<div class="bubble-meta">Anda — ${time}</div></div>`);
  inp.value='';
  scroll.scrollTop = scroll.scrollHeight;
  setTimeout(()=>{
    scroll.insertAdjacentHTML('beforeend', `<div class="bubble them">Diterima, lanjutkan ya.<div class="bubble-meta">SPV Area — ${time}</div></div>`);
    scroll.scrollTop = scroll.scrollHeight;
  }, 1000);
}

/* ---------- MENU (grid semua fitur) ---------- */
addScreen('menu', `
  <div class="search-wrap">${ICO.search}<input class="input" id="menuSearch" placeholder="Cari fitur..." oninput="renderMenu()"></div>
  <div id="menuBody"></div>
`);
function renderMenu(){
  const q = (document.getElementById('menuSearch').value||'').toLowerCase();
  const body = document.getElementById('menuBody');
  body.innerHTML = FEATURES.map(cat=>{
    const items = cat.items.filter(i=>i.title.toLowerCase().includes(q));
    if(!items.length) return '';
    return `<div class="cat-block"><div class="section-title">${cat.cat}</div><div class="feat-grid">
      ${items.map(i=>`
        <div class="feat-card" onclick="${i.built?`openScreen('${i.id}')`:`openFeature('${i.id}')`}">
          <div class="ic">${ICO[i.icon]}</div>
          <b>${i.title}</b>
        </div>`).join('')}
    </div></div>`;
  }).join('') || `<div class="empty-note">Tidak ada fitur yang cocok.</div>`;
}

/* ---------- GENERIC FEATURE SCREEN ---------- */
addScreen('feature', `<div id="featureBody"></div>`);
let currentFeature = null;
function openFeature(id){
  currentFeature = id;
  renderFeature();
  openScreen('feature');
}
function renderFeature(){
  const f = FEATURE_INDEX[currentFeature];
  let extra = '';
  if(f.id==='qr'){
    extra = `<div class="qr-frame"><i></i><i></i><i></i><i></i><div class="scanline"></div></div><div class="empty-note">Arahkan kamera ke barcode ONU, SN modem, atau QR material.</div>`;
  } else if(f.id==='kalkulatorteknisi'){
    extra = `<div class="card">
      <div class="field"><label>dBm</label><input class="input" type="number" id="dbmIn" value="-15" oninput="calcDbm()"></div>
      <div class="result-box"><div class="lbl">Setara Daya</div><div class="big" id="mwOut" style="color:var(--accent);">—</div></div>
    </div>`;
  } else if(f.id==='monitoringonu'){
    const devices = [
      {name:'ONU — Budi Santoso', s:'online', rx:'-19.2 dBm', up:'12h 40m'},
      {name:'ONU — Siti Aminah', s:'los', rx:'—', up:'0m'},
      {name:'ONU — Warkop Setia Kawan', s:'online', rx:'-21.5 dBm', up:'3d 4h'},
      {name:'ONU — Rudi Hartono', s:'offline', rx:'—', up:'1h 12m lalu'},
    ];
    extra = `<div class="card" style="padding:2px 16px;">${devices.map(d=>`
      <div class="net-node">
        <div class="dot ${d.s==='online'?'good':d.s==='los'?'bad':'warn'} ${d.s==='online'?'pulse':''}"></div>
        <div style="flex:1;"><b style="display:block;">${d.name}</b><span style="color:var(--text-faint); font-size:11px;">Rx ${d.rx} · Uptime ${d.up}</span></div>
        <span class="pill ${d.s==='online'?'good':d.s==='los'?'bad':'warn'}">${d.s==='online'?'Online':d.s==='los'?'LOS':'Offline'}</span>
      </div>`).join('')}</div>`;
  } else if(f.id==='petajaringan'){
    extra = `<div class="card" style="padding:2px 16px;">
      <div class="net-node"><div class="sq" style="background:var(--accent-dim); color:var(--accent);">OLT</div><div style="flex:1;"><b>OLT Madiun-Core-01</b><br><span style="color:var(--text-faint);">128 port aktif</span></div><span class="dot good"></span></div>
      <div class="net-node"><div class="sq" style="background:var(--warn-dim); color:var(--warn);">ODC</div><div style="flex:1;"><b>ODC Kartoharjo-04</b><br><span style="color:var(--text-faint);">Kapasitas 288 core</span></div><span class="dot good"></span></div>
      <div class="net-node"><div class="sq" style="background:var(--surface-3); color:var(--text-dim);">ODP</div><div style="flex:1;"><b>ODP-KRT-021</b><br><span style="color:var(--text-faint);">11/16 port terpakai</span></div><span class="dot warn"></span></div>
      <div class="net-node"><div class="sq" style="background:var(--good-dim); color:var(--good);">PLG</div><div style="flex:1;"><b>5 pelanggan aktif</b><br><span style="color:var(--text-faint);">Terhubung ke ODP-KRT-021</span></div><span class="dot good"></span></div>
    </div>`;
  }
  document.getElementById('featureBody').innerHTML = `
    <div class="gen-hero"><div class="ic">${ICO[f.icon]}</div><div><h2>${f.title}</h2><p>${f.desc}</p></div></div>
    ${extra}
    ${f.sub ? `<div class="section-title">Komponen Modul</div><div class="card" style="padding:2px 16px;">
      ${f.sub.map((s,i)=>`<div class="sub-row"><div class="n">${String(i+1).padStart(2,'0')}</div><span>${s}</span></div>`).join('')}
    </div>` : ''}
    ${!f.sub && !extra ? `<div class="empty-note">Modul ini akan ditampilkan lebih rinci di iterasi berikutnya.</div>` : ''}
  `;
  if(f.id==='kalkulatorteknisi') calcDbm();
}
function calcDbm(){
  const el = document.getElementById('dbmIn');
  if(!el) return;
  const dbm = parseFloat(el.value)||0;
  const mw = Math.pow(10, dbm/10);
  document.getElementById('mwOut').textContent = (mw<0.01? mw.toExponential(2) : mw.toFixed(3))+' mW';
}

/* ============================================================
   TOAST
============================================================ */
function toast(msg){
  let t = document.getElementById('toastEl');
  if(!t){
    t = document.createElement('div');
    t.id='toastEl';
    t.style.cssText = 'position:absolute; left:20px; right:20px; bottom:98px; background:var(--surface-3); color:var(--text); font-size:12.5px; font-weight:600; padding:12px 16px; border-radius:12px; text-align:center; z-index:100; box-shadow:0 10px 30px rgba(0,0,0,.4); border:1px solid var(--border); opacity:0; transition:opacity .25s;';
    document.getElementById('device').appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ t.style.opacity='0'; }, 1900);
}

/* ============================================================
   INIT
============================================================ */
renderCustList();
renderStHistory();
renderChecklist();
renderMenu();
render();

function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
tickClock();
setInterval(tickClock, 30000);
</script>

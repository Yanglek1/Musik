<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Monochrome Speed Test</title>
    <style>
        /* === TEMA MONOKROM MURNI === */
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --secondary-text: #888888;
            --panel-bg: #0a0a0a;
            --border-color: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
            position: relative;
        }

        /* === TOMBOL KEMBALI === */
        .btn-back {
            position: absolute;
            top: 25px;
            left: 20px;
            color: var(--secondary-text);
            text-decoration: none;
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.2s ease;
            z-index: 10;
        }
        
        .btn-back:hover { color: var(--text-color); }
        .btn-back svg { width: 18px; height: 18px; margin-right: 6px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        /* === ANIMASI === */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }
        .delay-4 { animation-delay: 0.7s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* === SPEEDOMETER SVG === */
        .speedometer-container {
            position: relative;
            width: 300px;
            height: 160px;
            margin-bottom: 20px;
        }

        svg.speedometer {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .meter-bg {
            fill: none;
            stroke: var(--border-color);
            stroke-width: 12;
            stroke-linecap: round;
        }

        .meter-progress {
            fill: none;
            stroke: var(--text-color);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 345.5;
            stroke-dashoffset: 345.5; 
            transition: stroke-dashoffset 0.15s ease-out;
        }

        .speed-text {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .main-speed {
            font-size: 3.5rem;
            font-weight: 300;
            line-height: 1;
        }

        .main-unit {
            font-size: 1rem;
            color: var(--secondary-text);
            font-weight: 500;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* === TOMBOL START LINGKARAN === */
        .btn-start-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 160px;
            margin-bottom: 30px;
        }

        .btn-start {
            background: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 2px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
        }

        .btn-start::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: pulse 2s infinite cubic-bezier(0.66, 0, 0, 1);
            opacity: 0;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
            100% { transform: scale(1.5); opacity: 0; box-shadow: 0 0 0px rgba(255,255,255,0); }
        }

        .btn-start:hover { background-color: rgba(255, 255, 255, 0.05); }
        .btn-start:active { transform: scale(0.92); }
        
        .btn-start:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            animation: none;
            transform: scale(1);
        }
        .btn-start:disabled::before { display: none; }

        /* === GRID METRIK === */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
        }

        .metric-box {
            background: var(--panel-bg);
            padding: 18px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            text-align: left;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .metric-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--secondary-text);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 400;
            margin-top: 8px;
        }

        .unit-label { font-size: 0.85rem; color: var(--secondary-text); }

        /* === INFO JARINGAN LENGKAP === */
        .network-info {
            width: 100%;
            display: flex;
            align-items: center;
            background: var(--panel-bg);
            padding: 15px 20px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 30px;
        }

        .user-icon {
            width: 45px;
            height: 45px;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .user-icon svg { width: 22px; height: 22px; fill: none; stroke: var(--secondary-text); stroke-width: 2; }
        
        .network-text { 
            font-size: 0.85rem; 
            line-height: 1.6; 
            color: var(--secondary-text); 
            width: 100%;
        }
        
        .network-text div {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 4px;
            margin-bottom: 4px;
        }
        
        .network-text div:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .network-text span { color: var(--text-color); font-weight: 500; text-align: right; }
        
        .divider { height: 1px; background: var(--border-color); margin: 0 0 30px 0; width: 100%; }

        /* === MENU BAWAH === */
        .bottom-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; }
        .menu-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: opacity 0.2s ease; text-align: center; }
        .menu-item:hover { opacity: 0.6; }
        .menu-icon-box {
            width: 100%; height: 90px; background: var(--panel-bg);
            border: 1px solid var(--border-color); border-radius: 16px;
            margin-bottom: 12px; display: flex; justify-content: center; align-items: center;
        }
        .menu-icon-box svg { width: 32px; height: 32px; fill: none; stroke: var(--text-color); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .menu-text { font-size: 0.85rem; color: var(--secondary-text); line-height: 1.4; padding: 0 5px; }
    </style>
</head>
<body>

    <!-- Tombol Kembali ke Laporan -->
    <a href="index.html" class="btn-back fade-in-up">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Kembali ke Portal
    </a>

    <div class="container">
        
        <div class="speedometer-container fade-in-up">
            <svg class="speedometer" viewBox="0 0 260 140">
                <path class="meter-bg" d="M 20 130 A 110 110 0 0 1 240 130" />
                <path class="meter-progress" id="meter-progress" d="M 20 130 A 110 110 0 0 1 240 130" />
            </svg>
            <div class="speed-text">
                <div class="main-speed" id="big-speed">0.00</div>
                <div class="main-unit" id="status-text">SIAP</div>
            </div>
        </div>

        <div class="btn-start-container fade-in-up delay-1">
            <button class="btn-start" id="start-btn" onclick="startRealTest()">PERGI</button>
        </div>

        <div class="metrics-grid fade-in-up delay-2">
            <div class="metric-box" id="box-dl">
                <div class="metric-label">Download</div>
                <div class="metric-value"><span id="val-dl">0.00</span> <span class="unit-label">Mbps</span></div>
            </div>
            <div class="metric-box" id="box-ul">
                <div class="metric-label">Upload</div>
                <div class="metric-value"><span id="val-ul">0.00</span> <span class="unit-label">Mbps</span></div>
            </div>
            <div class="metric-box" id="box-ping">
                <div class="metric-label">Ping</div>
                <div class="metric-value"><span id="val-ping">0</span> <span class="unit-label">ms</span></div>
            </div>
            <div class="metric-box" id="box-jitter">
                <div class="metric-label">Jitter</div>
                <div class="metric-value"><span id="val-jitter">0</span> <span class="unit-label">ms</span></div>
            </div>
        </div>

        <div class="network-info fade-in-up delay-3">
            <div class="user-icon">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <div class="network-text">
                <div>Provider: <span id="net-isp">Mendeteksi...</span></div>
                <div>IP Address: <span id="net-ip">Mendeteksi...</span></div>
                <div>Server: <span id="net-server">Mendeteksi...</span></div>
            </div>
        </div>

    </div>

    <script>
        const METER_DASHARRAY = 345.5; 
        const meterProgress = document.getElementById('meter-progress');
        
        meterProgress.style.strokeDasharray = METER_DASHARRAY;
        meterProgress.style.strokeDashoffset = METER_DASHARRAY;

        async function fetchNetworkInfo() {
            try {
                const response = await fetch('https://ipinfo.io/json');
                const data = await response.json();
                
                let providerName = data.org || "Tidak Diketahui";
                providerName = providerName.replace(/^AS\d+\s/, ''); 

                document.getElementById('net-isp').innerText = providerName;
                document.getElementById('net-ip').innerText = data.ip || "-";
                document.getElementById('net-server').innerText = data.city ? `${data.city}, ${data.country}` : "Server Publik";

            } catch (error) {
                try {
                    const cfRes = await fetch('https://1.1.1.1/cdn-cgi/trace');
                    const cfText = await cfRes.text();
                    
                    const ipMatch = cfText.match(/ip=(.*)/);
                    const coloMatch = cfText.match(/colo=(.*)/);
                    
                    document.getElementById('net-ip').innerText = ipMatch ? ipMatch[1] : "-";
                    document.getElementById('net-isp').innerText = "Koneksi Langsung";
                    document.getElementById('net-server').innerText = `Cloudflare Server (${coloMatch ? coloMatch[1] : 'Global'})`;
                } catch (err2) {
                    document.getElementById('net-isp').innerText = "Diblokir Browser";
                    document.getElementById('net-ip').innerText = "Koneksi Pribadi";
                    document.getElementById('net-server').innerText = "Tidak dapat dijangkau";
                }
            }
        }

        function updateSpeedometer(speedMbps) {
            const maxSpeed = 150; 
            let percentage = speedMbps / maxSpeed;
            if (percentage > 1) percentage = 1; 
            const offset = METER_DASHARRAY - (percentage * METER_DASHARRAY);
            meterProgress.style.strokeDashoffset = offset;
        }

        function popMetric(id) {
            const el = document.getElementById(id);
            el.style.transform = 'scale(1.05)';
            el.style.backgroundColor = '#1a1a1a';
            setTimeout(() => {
                el.style.transform = 'scale(1)';
                el.style.backgroundColor = '#0a0a0a';
            }, 300);
        }

        async function measureRealPing() {
            let pings = [];
            for (let i = 0; i < 5; i++) {
                const start = performance.now();
                await fetch(`https://speed.cloudflare.com/__down?bytes=0&r=${Math.random()}`, { cache: 'no-store' });
                const end = performance.now();
                pings.push(end - start);
            }
            
            const avgPing = pings.reduce((a, b) => a + b, 0) / pings.length;
            
            let jitter = 0;
            for (let i = 1; i < pings.length; i++) {
                jitter += Math.abs(pings[i] - pings[i - 1]);
            }
            jitter = pings.length > 1 ? jitter / (pings.length - 1) : 0;

            return { ping: Math.round(avgPing), jitter: Math.round(jitter) };
        }

        async function measureRealDownload(mainDisplay, miniDisplayId) {
            const bytesToDownload = 25 * 1024 * 1024; 
            const url = `https://speed.cloudflare.com/__down?bytes=${bytesToDownload}&r=${Math.random()}`;
            
            const response = await fetch(url, { cache: 'no-store' });
            const reader = response.body.getReader();
            
            let receivedLength = 0;
            const startTime = performance.now();
            let lastReportTime = startTime;
            let finalSpeed = 0;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                receivedLength += value.length;
                const now = performance.now();
                
                if (now - lastReportTime > 100) {
                    const durationInSeconds = (now - startTime) / 1000;
                    const bitsLoaded = receivedLength * 8;
                    const speedMbps = (bitsLoaded / durationInSeconds) / (1000 * 1000); 
                    
                    const displayValue = speedMbps.toFixed(2);
                    document.getElementById(miniDisplayId).innerText = displayValue;
                    mainDisplay.innerText = displayValue;
                    updateSpeedometer(speedMbps);
                    
                    finalSpeed = speedMbps;
                    lastReportTime = now;
                }
            }
            return finalSpeed;
        }

        function measureRealUpload(mainDisplay, miniDisplayId) {
            return new Promise((resolve) => {
                const payloadSize = 10 * 1024 * 1024; 
                const payload = new Uint8Array(payloadSize); 
                for(let i=0; i<payloadSize; i++) payload[i] = Math.random() * 255;
                
                const startTime = performance.now();
                let lastReportTime = startTime;
                
                const xhr = new XMLHttpRequest();
                xhr.open('POST', `https://speed.cloudflare.com/__up?r=${Math.random()}`, true);
                xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                
                xhr.upload.onprogress = function(e) {
                    if (e.lengthComputable) {
                        const now = performance.now();
                        const durationInSeconds = (now - startTime) / 1000;
                        
                        if (now - lastReportTime > 100) {
                            const speedMbps = ((e.loaded * 8) / durationInSeconds) / (1000 * 1000);
                            
                            const displayValue = speedMbps.toFixed(2);
                            document.getElementById(miniDisplayId).innerText = displayValue;
                            mainDisplay.innerText = displayValue;
                            updateSpeedometer(speedMbps);
                            
                            lastReportTime = now;
                        }
                    }
                };
                
                xhr.onload = function() {
                    const totalDuration = (performance.now() - startTime) / 1000;
                    const finalSpeed = (payloadSize * 8 / totalDuration) / (1000 * 1000);
                    
                    const displayValue = finalSpeed.toFixed(2);
                    document.getElementById(miniDisplayId).innerText = displayValue;
                    mainDisplay.innerText = displayValue;
                    
                    resolve(finalSpeed);
                };
                
                xhr.onerror = function() { resolve(0); };
                xhr.send(payload);
            });
        }

        async function startRealTest() {
            const btn = document.getElementById('start-btn');
            const statusText = document.getElementById('status-text');
            const bigSpeed = document.getElementById('big-speed');
            
            btn.disabled = true;
            btn.innerText = "MENGUJI";
            ['val-dl', 'val-ul', 'val-ping', 'val-jitter'].forEach(id => document.getElementById(id).innerText = "0");
            bigSpeed.innerText = "0.00";
            updateSpeedometer(0);

            try {
                statusText.innerText = "PING";
                const pingData = await measureRealPing();
                document.getElementById('val-ping').innerText = pingData.ping;
                popMetric('box-ping');
                document.getElementById('val-jitter').innerText = pingData.jitter;
                popMetric('box-jitter');

                statusText.innerText = "UNDUH";
                await measureRealDownload(bigSpeed, 'val-dl');
                popMetric('box-dl');

                updateSpeedometer(0); 
                await new Promise(r => setTimeout(r, 500));

                statusText.innerText = "UNGGAH";
                await measureRealUpload(bigSpeed, 'val-ul');
                popMetric('box-ul');

                statusText.innerText = "SELESAI";
            } catch (error) {
                statusText.innerText = "GAGAL";
            } finally {
                updateSpeedometer(0); 
                bigSpeed.innerText = "- -"; 
                btn.innerText = "ULANGI";
                btn.disabled = false;
            }
        }

        window.onload = fetchNetworkInfo;
    </script>
</body>
</html>
